<svg xmlns="http://www.w3.org/2000/svg" width="364" height="362" viewBox="-2 -2 364 362" role="img" aria-labelledby="title desc">
  <title id="title">A string in memory: five letters and a null terminator</title>
  <desc id="desc">char name[6] = "Maria"; stores six characters side by side: M at index 0, a at 1, r at 2, i at 3, a at 4, and the null character backslash 0 at index 5. strlen(name) counts only the 5 letters before the null character, while sizeof name is 6, the whole array. printf and strlen stop when they reach the null character. char bad[5] = "Maria"; has no room left for it, so bad is not a string.</desc>
  <style>
    .c { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #ffffff; }
    .a { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #ffffff; }
    .big { font: 700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #ffffff; }
    .n { font: 500 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .box { fill: #2f4858; stroke: #7d838a; stroke-width: 1.5; }
    .alt { fill: #4a5560; stroke: #7d838a; stroke-width: 1.5; }
    .ok { fill: #3d6b5a; stroke: #7d838a; stroke-width: 1.5; }
    .bad { fill: #b83820; stroke: #7d838a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .note { fill: #5b6168; stroke: #7d838a; stroke-width: 1; }
  </style>
  <g text-anchor="middle" dominant-baseline="central">
    <rect class="note" x="0" y="0" width="360" height="40" rx="6"/>
    <text class="c" x="180" y="20">char name[6] = "Maria";</text>

    <!-- index row -->
    <rect class="box" x="0" y="54" width="60" height="28"/>
    <text class="a" x="30" y="68">[0]</text>
    <rect class="box" x="60" y="54" width="60" height="28"/>
    <text class="a" x="90" y="68">[1]</text>
    <rect class="box" x="120" y="54" width="60" height="28"/>
    <text class="a" x="150" y="68">[2]</text>
    <rect class="box" x="180" y="54" width="60" height="28"/>
    <text class="a" x="210" y="68">[3]</text>
    <rect class="box" x="240" y="54" width="60" height="28"/>
    <text class="a" x="270" y="68">[4]</text>
    <rect class="ok" x="300" y="54" width="60" height="28"/>
    <text class="a" x="330" y="68">[5]</text>

    <!-- value row -->
    <rect class="box" x="0" y="82" width="60" height="50"/>
    <text class="big" x="30" y="107">'M'</text>
    <rect class="box" x="60" y="82" width="60" height="50"/>
    <text class="big" x="90" y="107">'a'</text>
    <rect class="box" x="120" y="82" width="60" height="50"/>
    <text class="big" x="150" y="107">'r'</text>
    <rect class="box" x="180" y="82" width="60" height="50"/>
    <text class="big" x="210" y="107">'i'</text>
    <rect class="box" x="240" y="82" width="60" height="50"/>
    <text class="big" x="270" y="107">'a'</text>
    <rect class="ok" x="300" y="82" width="60" height="50"/>
    <text class="big" x="330" y="107">'\0'</text>

    <!-- strlen brace: the 5 letters -->
    <path d="M2,144 V152 H298 V144" stroke="#7d838a" stroke-width="2" fill="none"/>
    <path d="M150,152 V160" stroke="#7d838a" stroke-width="2"/>
    <rect class="note" x="60" y="160" width="180" height="26" rx="13"/>
    <text class="c" x="150" y="173">strlen(name) = 5</text>

    <!-- sizeof brace: all 6 slots -->
    <path d="M2,198 V206 H358 V198" stroke="#7d838a" stroke-width="2" fill="none"/>
    <path d="M180,206 V214" stroke="#7d838a" stroke-width="2"/>
    <rect class="note" x="90" y="214" width="180" height="26" rx="13"/>
    <text class="c" x="180" y="227">sizeof name = 6</text>

    <rect class="ok" x="0" y="254" width="360" height="46" rx="6"/>
    <text class="n" x="180" y="269">'\0' marks the end of the text:</text>
    <text class="n" x="180" y="288">printf and strlen stop there</text>

    <rect class="bad" x="0" y="312" width="360" height="46" rx="6"/>
    <text class="c" x="180" y="327">char bad[5] = "Maria";</text>
    <text class="n" x="180" y="346">no room for '\0', so bad is not a string</text>
  </g>
</svg>
