<svg xmlns="http://www.w3.org/2000/svg" width="364" height="400" viewBox="-2 -2 364 400" role="img" aria-labelledby="title desc">
  <title id="title">A pointer p holding the address of x</title>
  <desc id="desc">int x = 10; int *p = &amp;x; *p = 25; drawn as two boxes with example addresses. The pointer p, stored at address 2040, holds 1000, the address of x, shown as an arrow from p to x. x, stored at address 1000, now holds 25. p is 1000, the address of x. *p is 25, the value p points to. &amp;x is 1000, the same as p. &amp;p is 2040, because p has its own address. The statement *p = 25 went through the address and changed x without naming it.</desc>
  <style>
    .c { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #ffffff; }
    .a { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #ffffff; }
    .big { font: 700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #ffffff; }
    .n { font: 500 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .box { fill: #2f4858; stroke: #7d838a; stroke-width: 1.5; }
    .alt { fill: #4a5560; stroke: #7d838a; stroke-width: 1.5; }
    .ok { fill: #3d6b5a; stroke: #7d838a; stroke-width: 1.5; }
    .bad { fill: #b83820; stroke: #7d838a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .note { fill: #5b6168; stroke: #7d838a; stroke-width: 1; }
  </style>
  <g text-anchor="middle" dominant-baseline="central">
    <rect class="note" x="0" y="0" width="360" height="40" rx="6"/>
    <text class="c" x="180" y="20">int x = 10; int *p = &amp;x; *p = 25;</text>

    <!-- p box -->
    <rect class="note" x="0" y="58" width="140" height="26" rx="4"/>
    <text class="c" x="70" y="71">int *p</text>
    <rect class="box" x="0" y="84" width="140" height="50"/>
    <text class="big" x="70" y="109">1000</text>
    <rect class="note" x="2" y="138" width="136" height="22" rx="11"/>
    <text class="a" x="70" y="149">at address 2040</text>

    <!-- arrow from p to x -->
    <path d="M140,109 H206" stroke="#7d838a" stroke-width="2.5" fill="none"/>
    <polygon points="218,109 204,102 204,116" fill="#7d838a"/>

    <!-- x box -->
    <rect class="note" x="220" y="58" width="140" height="26" rx="4"/>
    <text class="c" x="290" y="71">int x</text>
    <rect class="ok" x="220" y="84" width="140" height="50"/>
    <text class="big" x="290" y="109">25</text>
    <rect class="note" x="222" y="138" width="136" height="22" rx="11"/>
    <text class="a" x="290" y="149">at address 1000</text>

    <rect class="note" x="20" y="168" width="320" height="22" rx="11"/>
    <text class="n" x="180" y="179">p holds x's address, so p points to x</text>

    <!-- expression table -->
    <rect class="box" x="0" y="198" width="70" height="31" rx="4"/>
    <text class="c" x="35" y="213.5">p</text>
    <rect class="note" x="76" y="198" width="284" height="31" rx="4"/>
    <text class="n" x="218" y="213.5">1000, the address of x</text>
    <rect class="box" x="0" y="235" width="70" height="31" rx="4"/>
    <text class="c" x="35" y="250.5">*p</text>
    <rect class="note" x="76" y="235" width="284" height="31" rx="4"/>
    <text class="n" x="218" y="250.5">25, the value p points to</text>
    <rect class="box" x="0" y="272" width="70" height="31" rx="4"/>
    <text class="c" x="35" y="287.5">&amp;x</text>
    <rect class="note" x="76" y="272" width="284" height="31" rx="4"/>
    <text class="n" x="218" y="287.5">1000, the same as p</text>
    <rect class="box" x="0" y="309" width="70" height="31" rx="4"/>
    <text class="c" x="35" y="324.5">&amp;p</text>
    <rect class="note" x="76" y="309" width="284" height="31" rx="4"/>
    <text class="n" x="218" y="324.5">2040, p has its own address</text>

    <rect class="ok" x="0" y="350" width="360" height="46" rx="6"/>
    <text class="n" x="180" y="365">*p = 25; went through the address</text>
    <text class="n" x="180" y="384">and changed x without naming it</text>
  </g>
</svg>
